# CI — the checks `make ci` + `make validate` run, mirrored on every push/PR.
# Documented in README.md ("Versioning, changelog and CI"). Five independent jobs:
#   rust       — ctx-symbols + md-db: fmt-check, clippy -D warnings, tests; §6 conformance fixtures
#   shellcheck — lints every gate script (errors fail the build)
#   plugin     — JSON sanity + eval-suite validation + `claude plugin validate --strict`
#   hosts      — Codex hooks emulation + OpenCode plugin end-to-end + the dsh plugin on the real,
#                pinned DeepSeek Harness runtime against a scripted model (no network, no tokens)
#   macos      — the host tests (the real dsh runtime too) and the conformance fixtures on macOS
#                (symlinked /var temp dirs, BSD userland): the v0.12.0 release run found two bugs
#                Linux CI never saw
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugin/tools/ctx-symbols
            plugin/tools/md-db
      - name: fmt --check
        run: make fmt-check
      - name: clippy -D warnings
        run: make clippy
      - name: test (ctx-symbols + md-db)
        run: make test
      - uses: actions/setup-node@v4   # §6.19 runs the OpenCode plugin test
        with:
          node-version: "22"
      - name: conformance fixtures (ROADMAP §6, real gates on a fixture crate)
        run: make conformance

  shellcheck:
    name: shellcheck (gate scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint gate scripts
        run: make shellcheck

  hosts:
    name: hosts (codex hooks · opencode plugin · dsh plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Byte-compile the Python hook scripts
        run: make pycheck
      - name: Install the pinned DeepSeek Harness (dsh) runtime
        # dsh is a preview: pinned, and re-verified on each release (ROADMAP §4.9)
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2
          echo "DSH_BIN=$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js" >> "$GITHUB_ENV"
          echo "ALOOP_REQUIRE_DSH=1" >> "$GITHUB_ENV"
      - name: Codex hooks emulation + OpenCode plugin + dsh plugin end-to-end
        run: make test-hosts

  macos:
    name: macos (hosts · conformance)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugin/tools/ctx-symbols
            plugin/tools/md-db
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the pinned DeepSeek Harness (dsh) runtime
        # dsh is a preview: pinned, and re-verified on each release (ROADMAP §4.9)
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2
          echo "DSH_BIN=$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js" >> "$GITHUB_ENV"
          echo "ALOOP_REQUIRE_DSH=1" >> "$GITHUB_ENV"
      - name: Host tests (budget, events, Codex hooks, OpenCode and dsh plugins)
        run: make test-hosts
        env:
          BASH32: /bin/bash   # stock macOS bash 3.2: bash-portable.test.py runs the gate matrix on it
      - name: Conformance fixtures (ROADMAP §6)
        run: make conformance

  plugin:
    name: plugin (json · evals · validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate plugin.json + marketplace.json
        run: make json
      - name: Validate every eval suite's JSON
        run: make eval-validate
      - name: Assert versions agree (plugin.json · Cargo.toml · CHANGELOG)
        run: make version-check
      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: claude plugin validate --strict
        run: claude plugin validate ./plugin --strict
