<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--background)}.g{display:grid;gap:10px}.sw{border-radius:12px;height:64px}.n{font:700 13px/1.3 var(--font-sans);margin-top:8px}.h{font:400 12px/1.3 var(--font-mono);color:var(--text-muted)}.m{font:400 12px/1.3 var(--font-sans);color:var(--text-secondary)}</style></head><body><div style="display:flex;gap:24px;padding:10px;background:var(--surface);border-radius:12px"><div style="flex:1;height:84px;border-radius:12px;background:#fff;box-shadow:var(--shadow-0);border:1px solid var(--border);display:grid;place-items:center" class="h">shadow-0</div><div style="flex:1;height:84px;border-radius:12px;background:#fff;box-shadow:var(--shadow-1);display:grid;place-items:center" class="h">shadow-1</div><div style="flex:1;height:84px;border-radius:12px;background:#fff;box-shadow:var(--shadow-2);display:grid;place-items:center" class="h">shadow-2</div><div style="flex:1;height:84px;border-radius:12px;background:#fff;box-shadow:var(--shadow-3);display:grid;place-items:center" class="h">shadow-3</div></div></body></html>
