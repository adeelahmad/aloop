<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--background)}.g{display:grid;gap:10px}.sw{border-radius:12px;height:64px}.n{font:700 13px/1.3 var(--font-sans);margin-top:8px}.h{font:400 12px/1.3 var(--font-mono);color:var(--text-muted)}.m{font:400 12px/1.3 var(--font-sans);color:var(--text-secondary)}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="n">Intent</div><div class="h">#E8F0FE</div></div><div><div class="sw" style="background:var(--red-surface);border:1px solid var(--red-border)"></div><div class="n">Red</div><div class="h">#FCE8E6</div></div><div><div class="sw" style="background:var(--green-surface);border:1px solid var(--green-border)"></div><div class="n">Green</div><div class="h">#E6F4EA</div></div><div><div class="sw" style="background:var(--gate-surface);border:1px solid var(--gate-border)"></div><div class="n">Gate</div><div class="h">#FEF7E0</div></div><div><div class="sw" style="background:var(--surface-neutral);border:1px solid var(--border)"></div><div class="n">Evidence</div><div class="h">#F1F3F4</div></div><div><div class="sw" style="background:var(--graph-edge);"></div><div class="n">Graph edge</div><div class="h">#A8C7FA</div></div></div></body></html>
