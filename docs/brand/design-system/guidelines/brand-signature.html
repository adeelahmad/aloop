<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--background)}.g{display:grid;gap:10px}.sw{border-radius:12px;height:64px}.n{font:700 13px/1.3 var(--font-sans);margin-top:8px}.h{font:400 12px/1.3 var(--font-mono);color:var(--text-muted)}.m{font:400 12px/1.3 var(--font-sans);color:var(--text-secondary)}</style></head><body><div style="display:flex;align-items:center;gap:28px"><div style="display:flex;gap:10px"><span style="width:22px;height:22px;border-radius:50%;background:var(--aladdin-blue)"></span><span style="width:22px;height:22px;border-radius:50%;background:var(--aladdin-red)"></span><span style="width:22px;height:22px;border-radius:50%;background:var(--aladdin-green)"></span><span style="width:22px;height:22px;border-radius:50%;background:var(--aladdin-gold)"></span></div><div style="font:800 44px/1 var(--font-sans);letter-spacing:-.03em">Aladdin</div></div><div style="margin-top:16px;font:500 12px/1 var(--font-mono);color:var(--text-muted);letter-spacing:.08em">INTENT → RED → GREEN → GATE</div></body></html>
