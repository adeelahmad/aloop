<!-- @dsCard group="Colors" viewport="700x150" name="Terminal palette" subtitle="CLI / transcript surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--background)}.g{display:grid;gap:10px}.sw{border-radius:12px;height:64px}.n{font:700 13px/1.3 var(--font-sans);margin-top:8px}.h{font:400 12px/1.3 var(--font-mono);color:var(--text-muted)}.m{font:400 12px/1.3 var(--font-sans);color:var(--text-secondary)}</style></head><body><div style="background:var(--term-bg);border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;font:500 12px/1.3 var(--font-mono)"><div><div style="height:36px;border-radius:8px;background:var(--term-fg)"></div><div style="color:var(--term-fg);margin-top:6px">fg</div></div><div><div style="height:36px;border-radius:8px;background:var(--term-muted)"></div><div style="color:var(--term-muted);margin-top:6px">muted</div></div><div><div style="height:36px;border-radius:8px;background:var(--term-blue)"></div><div style="color:var(--term-blue);margin-top:6px">intent</div></div><div><div style="height:36px;border-radius:8px;background:var(--term-red)"></div><div style="color:var(--term-red);margin-top:6px">red</div></div><div><div style="height:36px;border-radius:8px;background:var(--term-green)"></div><div style="color:var(--term-green);margin-top:6px">green</div></div><div><div style="height:36px;border-radius:8px;background:var(--term-gold)"></div><div style="color:var(--term-gold);margin-top:6px">gate</div></div></div></body></html>
