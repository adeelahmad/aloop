<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--background)}.g{display:grid;gap:10px}.sw{border-radius:12px;height:64px}.n{font:700 13px/1.3 var(--font-sans);margin-top:8px}.h{font:400 12px/1.3 var(--font-mono);color:var(--text-muted)}.m{font:400 12px/1.3 var(--font-sans);color:var(--text-secondary)}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px"><div style="text-align:center"><div style="width:4px;height:4px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">4</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">8</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">12</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">16</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">20</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">24</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">32</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">40</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">48</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">64</div></div><div style="text-align:center"><div style="width:80px;height:80px;background:var(--intent-surface);border:1px solid var(--intent-border)"></div><div class="h" style="margin-top:6px">80</div></div></div></body></html>
