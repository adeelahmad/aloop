<!-- @dsCard group="Colors" viewport="700x130" name="Color grammar" subtitle="Intent → RED → GREEN → Gate" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--background)}.g{display:grid;gap:10px}.sw{border-radius:12px;height:64px}.n{font:700 13px/1.3 var(--font-sans);margin-top:8px}.h{font:400 12px/1.3 var(--font-mono);color:var(--text-muted)}.m{font:400 12px/1.3 var(--font-sans);color:var(--text-secondary)}</style></head><body><div style="display:flex;align-items:center;gap:14px;font:700 15px/1 var(--font-sans)"><span style="display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:50%;background:var(--aladdin-blue);"></span>Intent</span><span style="color:var(--text-muted)">→</span><span style="display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:50%;background:var(--aladdin-red);"></span>RED</span><span style="color:var(--text-muted)">→</span><span style="display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:50%;background:var(--aladdin-green);"></span>GREEN</span><span style="color:var(--text-muted)">→</span><span style="display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:3px;background:var(--aladdin-gold);transform:rotate(45deg) scale(.85)"></span>Gate</span></div><div style="margin-top:16px;font:400 13px/1.5 var(--font-sans);color:var(--text-secondary)">Gray carries evidence, history and provenance. No color is ever decorative.</div></body></html>
